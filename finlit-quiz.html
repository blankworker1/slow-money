<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Ledgers — A Financial Literacy Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b2e;
    --paper:#eef1ea;
    --paper-card:#ffffff;
    --rule:#c9cfc4;
    --blue:#3d5a73;
    --blue-dim:#e6ecf0;
    --copper:#9c5a34;
    --copper-dim:#f4e9df;
    --muted:#5c6b64;
    --good:#3d6b4f;
    --serif: 'Source Serif 4', Georgia, serif;
    --mono: 'IBM Plex Mono', 'SF Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    line-height:1.5;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:32px 20px 80px;
    min-height:100vh;
  }
  .ledgerline{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.04em;
    color:var(--muted);
    margin-bottom:28px;
  }
  .ledgerline .dash{flex:1;height:1px;background:var(--rule);}
  .module-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:11px;
    padding:3px 8px;
    border-radius:2px;
  }
  .tag-1{background:var(--blue-dim);color:var(--blue);}
  .tag-2{background:var(--copper-dim);color:var(--copper);}

  h1{font-size:2rem;font-weight:600;margin:0 0 6px;letter-spacing:-.01em;}
  h2{font-size:1.35rem;font-weight:600;margin:0 0 14px;letter-spacing:-.01em;}
  p{margin:0 0 14px;color:var(--ink);}
  .muted{color:var(--muted);}

  .intro-card{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:28px 26px;
    margin-bottom:20px;
  }
  .intro-card + .intro-card{margin-top:-6px;}
  .accountline{
    display:flex;justify-content:space-between;gap:16px;
    font-family:var(--mono);font-size:13px;color:var(--muted);
    border-top:1px dashed var(--rule);
    padding-top:12px;margin-top:16px;
  }

  button.primary{
    font-family:var(--serif);
    font-size:1rem;
    font-weight:600;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:13px 22px;
    border-radius:2px;
    cursor:pointer;
  }
  button.primary:hover{background:#0f1a1c;}
  button.primary:disabled{background:#b7bdb6;cursor:not-allowed;}

  .progress{
    height:3px;background:var(--rule);border-radius:2px;margin-bottom:26px;overflow:hidden;
  }
  .progress-fill{height:100%;background:var(--ink);transition:width .3s ease;}

  .qcard{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:26px;
  }
  .qframing{
    font-size:.95rem;
    color:var(--muted);
    border-left:2px solid var(--rule);
    padding-left:14px;
    margin-bottom:18px;
  }
  .qtext{font-size:1.15rem;font-weight:600;margin-bottom:18px;line-height:1.4;}

  .opt{
    display:block;
    width:100%;
    text-align:left;
    font-family:var(--serif);
    font-size:.98rem;
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
    color:var(--ink);
  }
  .opt:hover{border-color:var(--ink);}
  .opt.selected{border-color:var(--ink);background:var(--blue-dim);}
  .opt.correct{border-color:var(--good);background:#e5f0e8;}
  .opt.incorrect{border-color:#a3402f;background:#f6e6e2;}
  .opt:disabled{cursor:default;}

  .yn{display:flex;gap:10px;}
  .yn .opt{flex:1;text-align:center;padding:14px;}

  .explain{
    margin-top:14px;
    padding:12px 14px;
    background:#f4f6f1;
    border-radius:2px;
    font-size:.9rem;
    color:var(--muted);
  }

  .likert{margin-top:6px;}
  .likert-scale{display:flex;gap:6px;margin-bottom:10px;}
  .likert-btn{
    flex:1;aspect-ratio:1;
    border:1px solid var(--rule);
    border-radius:50%;
    background:var(--paper);
    cursor:pointer;
    font-family:var(--mono);
    font-size:.8rem;
    color:var(--muted);
  }
  .likert-btn.selected{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .likert-labels{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);}

  .navrow{display:flex;justify-content:flex-end;margin-top:20px;}

  .interstitial{text-align:center;padding:60px 20px;}
  .bignum{font-family:var(--mono);font-size:3rem;font-weight:600;}

  /* Results */
  .resultsgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
  @media(max-width:520px){.resultsgrid{grid-template-columns:1fr;}}
  .resultcard{
    background:var(--paper-card);border:1px solid var(--rule);border-radius:3px;padding:20px;
  }
  .resultcard h3{
    font-family:var(--mono);font-size:.78rem;letter-spacing:.03em;font-weight:600;
    margin:0 0 4px;color:var(--muted);text-transform:none;
  }
  .resulttotal{font-family:var(--mono);font-size:2.4rem;font-weight:600;margin:2px 0 14px;}
  .breakrow{
    display:flex;justify-content:space-between;font-size:.88rem;
    padding:7px 0;border-top:1px solid var(--rule);
  }
  .breakrow:first-of-type{border-top:none;}
  .breakrow .val{font-family:var(--mono);color:var(--muted);}
  .card-1{border-top:3px solid var(--blue);}
  .card-2{border-top:3px solid var(--copper);}

  .gridviz{
    background:var(--paper-card);border:1px solid var(--rule);border-radius:3px;
    padding:20px;margin-bottom:20px;
  }
  .gridviz svg{width:100%;height:auto;display:block;}

  .restart{
    display:block;margin:30px auto 0;background:none;border:none;
    font-family:var(--mono);font-size:.82rem;color:var(--muted);
    text-decoration:underline;cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- DATA ---------- */

const MOD1_KNOWLEDGE = [
  {
    framing: "Financial life is full of everyday arithmetic — splitting a bill, working out your share of a group gift, dividing a payment across months. This first question checks a basic calculation like that.",
    q: "Five people share a gift of €1,000 equally. How much does each person receive?",
    options: ["€100","€200","€500","€2,000"],
    correct: 1,
    explain: "€1,000 ÷ 5 = €200 each."
  },
  {
    framing: "Interest is the price of money over time — what a bank pays you for holding your savings, or what a lender charges you for borrowing. It's one of the most basic building blocks of financial decision-making.",
    q: "You put €100 into a savings account that pays 2% interest per year, and you don't add or withdraw anything. How much would be in the account after 1 year?",
    options: ["€98","€100","€102","€120"],
    correct: 2,
    explain: "2% of €100 is €2, so the balance grows to €102."
  },
  {
    framing: "Interest doesn't always grow at the same steady rate — whether it's calculated only on the original amount, or on the growing balance each year, changes how quickly money accumulates.",
    q: "Using the same account as before (2% per year, no withdrawals), after 5 years would the balance be more than, exactly, or less than €110?",
    options: ["More than €110","Exactly €110","Less than €110","Don't know"],
    correct: 0,
    explain: "Because interest compounds — you earn interest on your interest, not just your original €100 — after 5 years the balance exceeds €110."
  },
  {
    framing: "Not every transfer of money between people involves interest — informal loans between friends or family often don't. Recognizing when interest actually applies matters for everyday money decisions.",
    q: "You lend €25 to a friend one evening, and they give you back exactly €25 the next day. How much interest did they pay you?",
    options: ["€25","€2.50","€0","Depends on the bank"],
    correct: 2,
    explain: "No interest was charged — exactly the same amount was returned."
  },
  {
    framing: "You'll often hear the word 'inflation' in the news, usually connected to rising prices. This question checks the basic definition before we look at its effects.",
    q: "Which of these best describes 'inflation'?",
    options: ["A fall in the general level of prices","A rise in the general level of prices for goods and services","An increase in wages across the economy","A decrease in interest rates set by the central bank"],
    correct: 1,
    explain: "Inflation is a sustained rise in the general price level — meaning the same amount of money buys less over time."
  },
  {
    framing: "Once you know what inflation is, the next question is what it actually does to money sitting in an account that isn't growing fast enough to keep up.",
    q: "If inflation is running at 5% per year and your savings account only pays 2% interest per year, after one year could you buy more, the same, or less than you can buy today with that money?",
    options: ["More","The same","Less","It depends on the currency"],
    correct: 2,
    explain: "Because prices are rising faster (5%) than your money is growing (2%), your real purchasing power falls."
  },
  {
    framing: "Putting money into investments always carries some risk — but not all ways of investing carry the same amount of risk for the same potential reward. This question is about how spreading money across investments changes the risk you're taking on.",
    q: "Which of these is generally true?",
    options: ["Putting all your savings into shares of a single company is less risky than spreading them across many companies","Putting all your savings into shares of a single company is more risky than spreading them across many companies","The level of risk is the same no matter how many companies you invest in","Spreading your savings across many companies guarantees a profit"],
    correct: 1,
    explain: "This is called diversification — spreading investments reduces the impact of any single company performing badly."
  }
];

const MOD1_BEHAVIOUR = [
  { framing: "Managing money well often starts with simply knowing where it's going. A budget — even an informal one — is one of the most basic financial planning tools.", q: "Do you (personally, or as part of your household) prepare and follow a budget to plan your income and expenses?", reverse:false },
  { framing: "Saving isn't only about reaching a specific target — it can simply mean setting money aside regularly, in any form.", q: "In the past 12 months, have you been saving money in any way — cash, a bank account, an investment — whether or not you had a specific goal in mind?", reverse:false },
  { framing: "Some financial goals are years or decades away — a home, education, retirement — and reaching them usually takes deliberate, ongoing effort rather than luck.", q: "Do you set long-term financial goals and actively work toward achieving them?", reverse:false },
  { framing: "Impulse purchases and planned purchases often lead to very different financial outcomes over time.", q: "Before making a significant purchase, do you carefully consider whether you can actually afford it?", reverse:false },
  { framing: "Missed or late payments can trigger fees, damage your credit standing, and compound financial stress.", q: "Do you generally pay your bills on time?", reverse:false },
  { framing: "Some people check their financial position regularly; others rarely look until something goes wrong.", q: "Do you keep a close, ongoing watch on your financial affairs — for example, checking balances or reviewing statements regularly?", reverse:false },
  { framing: "Financial products — bank accounts, loans, insurance policies — vary significantly between providers, even for what looks like the same product.", q: "Before choosing a financial product, do you compare offers from more than one provider?", reverse:false },
  { framing: "Advice about money isn't always neutral — sometimes the person offering it benefits from what you decide.", q: "When making an important financial decision, do you seek advice from an independent source, rather than relying only on whoever is selling you the product?", reverse:false },
  { framing: "Sometimes people need to borrow simply to get through the month, not to invest or build something — a sign of financial strain rather than financial planning.", q: "In the past 12 months, have you had to borrow money or use credit just to cover everyday living expenses because money ran short?", reverse:true }
];

const MOD1_ATTITUDE = [
  { framing: "Some people focus mainly on today and let tomorrow take care of itself. Others plan carefully years in advance. It says something about your relationship with money over time.", statement: "I tend to focus on the short term and let the future take care of itself." },
  { framing: "This next statement is about how satisfying spending feels compared with saving.", statement: "I find it more satisfying to spend money now than to save it for the future." },
  { framing: "Finally, a statement about how money itself feels to you.", statement: "Money is there to be spent." }
];

const MOD2_KNOWLEDGE = [
  {
    framing: "Most people assume the amount of currency in existence is roughly fixed, the way the amount of gold in the world is roughly fixed. In reality, the supply of state-issued currency (like the euro or dollar) can be expanded — new units created — through decisions made by central banks and governments, particularly during crises or stimulus. This is different from an asset whose supply can't be altered by decree.",
    q: "Which is closer to true? The total supply of a national currency (e.g. the euro) is…",
    options: ["Fixed by law and cannot be changed","Determined by decisions of central banks and governments, and can be expanded","Fixed by the total amount of gold a country holds","Determined only by how much people want to borrow"],
    correct: 1,
    explain: "Central banks can and do expand the money supply — through bond purchases, reserve policy, and other tools — as a matter of policy, not physical constraint."
  },
  {
    framing: "When you deposit money in a bank, you might picture it sitting in a vault waiting for you. In practice, banks operate under 'fractional reserve banking' — they keep only a portion of deposits available as cash, and lend out the rest. This is how most money in a modern economy is actually created.",
    q: "Under fractional reserve banking, if you deposit €1,000 in a bank, roughly how much does the bank typically keep immediately available, lending out the rest?",
    options: ["All of it (100%)","Only a fraction of it","None of it","It depends only on your personal credit score"],
    correct: 1,
    explain: "Banks are required to hold only a fraction of deposits in reserve; the rest is lent out, which is how new deposits — and effectively new money — are created elsewhere in the system."
  },
  {
    framing: "There's a difference between holding cash in your hand and having a number on a bank app that says how much money you have. The bank balance is a claim — a promise the bank owes you that amount — not money set aside specifically for you. This is called counterparty risk.",
    q: "Which best describes the difference between cash in your wallet and money shown in your bank account balance?",
    options: ["There is no difference — both are equally 'yours' with the same certainty","Cash is money you hold directly; a bank balance is a claim on money the bank owes you","A bank balance is always safer than cash","Cash cannot lose value, but bank balances always can"],
    correct: 1,
    explain: "A bank balance depends on the bank remaining solvent and willing to pay — it's a liability of the bank to you, not a possession in the same sense as cash in hand."
  },
  {
    framing: "Deposit insurance schemes exist to protect savers if a bank fails, but they usually only cover deposits up to a certain limit — and in some crises, measures called 'bail-ins' have required depositors above that threshold to absorb some of a bank's losses directly.",
    q: "If a bank fails, deposit insurance schemes in the EU typically guarantee deposits…",
    options: ["In full, no matter how large the amount","Up to a set limit (currently €100,000 per depositor per bank in the EU)","Only for business accounts, not personal ones","Only if the account holder is a citizen of that country"],
    correct: 1,
    explain: "The EU-wide guarantee currently covers up to €100,000 per depositor, per bank — amounts above that are not automatically protected."
  },
  {
    framing: "Physical cash remains legal tender almost everywhere, but its practical usability has been shrinking — some countries cap the size of cash transactions, and many businesses now refuse or discourage cash payments entirely.",
    q: "In many EU countries today, is there a legal limit on the size of cash transactions?",
    options: ["No, cash can always be used for any amount","Yes, several countries cap large cash transactions and require electronic payment above a threshold","Cash has been fully abolished in the EU","Limits only apply to foreign tourists"],
    correct: 1,
    explain: "Several EU countries impose caps on large cash payments (thresholds vary by country), pushing larger transactions toward traceable electronic payment."
  },
  {
    framing: "Not every kind of money or asset can be created in unlimited quantity. Fiat currency supply is a policy decision. Gold's supply grows slowly through mining. Bitcoin's supply is fixed by its code at 21 million, with no entity able to issue more, regardless of demand.",
    q: "Which of these has a supply that is mathematically fixed and cannot be increased by any government, company, or institution?",
    options: ["The euro","Gold","Bitcoin","All three have a fixed supply"],
    correct: 2,
    explain: "Bitcoin's total supply is capped by its protocol at 21 million. The euro's supply is a policy choice; gold's supply, while scarce, still grows through ongoing mining."
  },
  {
    framing: "History offers real examples of what happens to savers when a currency loses most or all of its value quickly — from Weimar Germany in the 1920s to more recent cases like Venezuela, Zimbabwe, and Argentina.",
    q: "What term describes a rapid, severe loss of a currency's value, often destroying the savings of anyone holding it?",
    options: ["Deflation","Hyperinflation","Quantitative easing","Recession"],
    correct: 1,
    explain: "Hyperinflation describes extremely rapid, out-of-control price increases, which erode the value of savings held in that currency very quickly."
  }
];

const MOD2_BEHAVIOUR = [
  { framing: "Some people hold all their savings in a single currency; others intentionally spread savings across more than one currency or asset type to reduce dependence on any single one.", q: "Do you currently hold savings across more than one currency or asset type, rather than everything in a single national currency?" },
  { framing: "Physical cash kept outside the banking system can't be frozen, remotely limited, or affected by a bank's own problems — though it also can't earn interest and carries its own risks, like theft or loss.", q: "Do you keep a reserve of physical cash outside the banking system for emergencies?" },
  { framing: "Some people hold part of their savings in physical assets that exist entirely outside the banking system — gold, land, or other tangible property.", q: "Do you hold any portion of your savings in physical assets outside the banking system, such as gold, land, or other tangible property?" },
  { framing: "Bitcoin and other decentralized digital assets are a relatively new category — held directly by individuals rather than through a traditional financial institution.", q: "Have you ever held Bitcoin or another decentralized digital asset?" },
  { framing: "Holding an asset 'directly' — with nobody else able to move or freeze it without your say — is different from holding it through an account a company ultimately controls.", q: "For any significant digital or physical assets you hold, do you personally control access to them directly (e.g. your own private keys, or a safe you control), rather than relying entirely on a third party?" },
  { framing: "Banking disruptions do happen — from bank holidays and system outages to, in some countries, formal capital controls limiting how much money people can withdraw or move.", q: "Do you have a concrete plan for accessing funds if normal banking services were disrupted (e.g. a bank holiday, system outage, or capital controls)?" },
  { framing: "A savings balance that looks unchanged on paper can still be losing value in real terms if prices are rising faster than the balance is growing.", q: "Do you actively track the real, inflation-adjusted value of your savings, rather than just the nominal balance shown in your account?" },
  { framing: "Coverage of monetary policy varies a lot between mainstream financial media, central bank publications, and independent commentators.", q: "Do you seek out primary or independent sources on monetary policy, rather than relying only on mainstream financial media?" },
  { framing: "Keeping all of one's savings in a single bank means everything depends on that one institution's stability.", q: "Do you avoid keeping the majority of your savings in a single bank account or single institution?" }
];

const MOD2_ATTITUDE = [
  { framing: "Confidence that a currency will hold its value over time varies a lot depending on who you ask and which currency you mean.", statement: "I am confident that my national currency will hold its purchasing power over the next 10+ years.", reverse:true },
  { framing: "Cash is the original 'alternative' to the banking system — the one most people already have direct experience with.", statement: "I am comfortable holding a meaningful portion of my savings as physical cash, outside the banking system.", reverse:false },
  { framing: "Some people prefer to check and hold things themselves; others are comfortable trusting an institution to manage it for them.", statement: "I prefer assets I can personally verify and hold directly, over claims managed by an institution — regardless of the asset type.", reverse:false },
  { framing: "Direct control over an asset — cash, gold, or a digital asset — usually comes with direct responsibility for keeping it safe.", statement: "I am comfortable taking personal responsibility for securing my own assets, rather than delegating that responsibility to an institution.", reverse:false },
  { framing: "Institutions typically offer convenience — easy transfers, customer support, recovery options — in exchange for a degree of control.", statement: "I would accept some loss of convenience in exchange for reduced dependence on a bank or other institution.", reverse:false }
];

/* ---------- STATE ---------- */
let screen = "intro"; // intro | m1k | m1b | m1a | inter | m2k | m2b | m2a | results
let idx = 0;
let answered = false;
let selected = null;

const answers = { m1k:[], m1b:[], m1a:[], m2k:[], m2b:[], m2a:[] };

/* ---------- SCORING ---------- */
function scoreKnowledge(list, arr){
  let s=0; arr.forEach((a,i)=>{ if(a===list[i].correct) s++; });
  return s;
}
function scoreBehaviour(list, arr){
  let s=0; arr.forEach((a,i)=>{
    const yes = a===0; // option 0 = Yes
    const point = list[i].reverse ? !yes : yes;
    if(point) s++;
  });
  return s;
}
function scoreAttitude(list, arr){
  // arr values 1-5. normalize each to 0-1, reverse if needed, average, scale to 0-5
  let sum=0;
  arr.forEach((v,i)=>{
    let norm = (v-1)/4;
    if(list[i].reverse) norm = 1-norm;
    sum += norm;
  });
  const avg = sum/arr.length;
  return avg*5;
}

function computeTotals(){
  const k1 = scoreKnowledge(MOD1_KNOWLEDGE, answers.m1k);
  const b1 = scoreBehaviour(MOD1_BEHAVIOUR, answers.m1b);
  const a1 = scoreAttitude(MOD1_ATTITUDE, answers.m1a);
  const k2 = scoreKnowledge(MOD2_KNOWLEDGE, answers.m2k);
  const b2 = scoreBehaviour(MOD2_BEHAVIOUR, answers.m2b);
  const a2 = scoreAttitude(MOD2_ATTITUDE, answers.m2a);
  return {
    m1: {k:k1,b:b1,a:a1, total:k1+b1+a1},
    m2: {k:k2,b:b2,a:a2, total:k2+b2+a2}
  };
}

/* ---------- RENDER ---------- */
const app = document.getElementById("app");

function render(){
  if(screen==="intro") return renderIntro();
  if(screen==="m1k") return renderKnowledge(MOD1_KNOWLEDGE, "m1k", "m1b", "tag-1", "Module 1 — Traditional Financial Literacy (OECD/INFE-aligned)", "knowledge");
  if(screen==="m1b") return renderBehaviour(MOD1_BEHAVIOUR, "m1b", "m1a", "tag-1", "Module 1 — Traditional Financial Literacy", "behaviour");
  if(screen==="m1a") return renderAttitude(MOD1_ATTITUDE, "m1a", "inter", "tag-1", "Module 1 — Traditional Financial Literacy", "attitude");
  if(screen==="inter") return renderInterstitial();
  if(screen==="m2k") return renderKnowledge(MOD2_KNOWLEDGE, "m2k", "m2b", "tag-2", "Module 2 — Monetary Sovereignty & Structural Risk", "knowledge");
  if(screen==="m2b") return renderBehaviour(MOD2_BEHAVIOUR, "m2b", "m2a", "tag-2", "Module 2 — Monetary Sovereignty & Structural Risk", "behaviour");
  if(screen==="m2a") return renderAttitude(MOD2_ATTITUDE, "m2a", "results", "tag-2", "Module 2 — Monetary Sovereignty & Structural Risk", "attitude");
  if(screen==="results") return renderResults();
}

function renderIntro(){
  app.innerHTML = `
    <div class="ledgerline"><span>TWO LEDGERS</span><span class="dash"></span><span>v0.1 prototype</span></div>
    <h1>Two Ledgers</h1>
    <p class="muted">A side-by-side financial literacy assessment: one grounded in the OECD/INFE standard used by central banks worldwide, the other measuring understanding of monetary structural risk and alternatives to the banking system.</p>

    <div class="intro-card">
      <span class="module-tag tag-1">MODULE 1</span>
      <h2 style="margin-top:10px;">Traditional Financial Literacy</h2>
      <p class="muted">21 questions, structured around the internationally standardized OECD/INFE toolkit used by Banca d'Italia and 39+ countries. Your score is directly comparable to published national data.</p>
      <div class="accountline"><span>Knowledge</span><span>7</span></div>
      <div class="accountline"><span>Behaviour</span><span>9</span></div>
      <div class="accountline"><span>Attitude</span><span>up to 5</span></div>
    </div>

    <div class="intro-card">
      <span class="module-tag tag-2">MODULE 2</span>
      <h2 style="margin-top:10px;">Monetary Sovereignty &amp; Structural Risk</h2>
      <p class="muted">A parallel 21-question set — same shape, same scoring logic — measuring understanding of currency debasement, counterparty risk, and alternatives including physical cash, gold, and Bitcoin.</p>
      <div class="accountline"><span>Knowledge</span><span>7</span></div>
      <div class="accountline"><span>Behaviour</span><span>9</span></div>
      <div class="accountline"><span>Attitude</span><span>up to 5</span></div>
    </div>

    <p class="muted" style="font-size:.85rem;">Neither module has a pass/fail threshold. Your results are two totals, each out of 21, shown with a full breakdown of how they were reached — not a verdict.</p>

    <button class="primary" onclick="startQuiz()">Begin — Module 1</button>
  `;
}

function progressBar(current, total){
  const pct = Math.round((current/total)*100);
  return `<div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>`;
}

function renderKnowledge(list, key, nextScreen, tagClass, title, kind){
  const item = list[idx];
  const totalInModule = list.length;
  app.innerHTML = `
    <div class="ledgerline"><span class="module-tag ${tagClass}">${title}</span><span class="dash"></span><span>Knowledge ${idx+1} / ${totalInModule}</span></div>
    ${progressBar(idx, totalInModule)}
    <div class="qcard">
      <div class="qframing">${item.framing}</div>
      <div class="qtext">${item.q}</div>
      <div id="opts">
        ${item.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="selectKnowledge(${i})">${o}</button>`).join("")}
      </div>
      <div id="explainBox"></div>
      <div class="navrow"><button class="primary" id="nextBtn" disabled onclick="advanceKnowledge('${key}','${nextScreen}', ${list===MOD1_KNOWLEDGE || list===MOD2_KNOWLEDGE})">Next</button></div>
    </div>
  `;
  window.__currentKnowledgeList = list;
}

function selectKnowledge(i){
  if(answered) return;
  answered = true;
  selected = i;
  const item = window.__currentKnowledgeList[idx];
  document.querySelectorAll("#opts .opt").forEach((btn,bi)=>{
    btn.disabled = true;
    if(bi===item.correct) btn.classList.add("correct");
    else if(bi===i) btn.classList.add("incorrect");
  });
  document.getElementById("explainBox").innerHTML = `<div class="explain">${item.explain}</div>`;
  document.getElementById("nextBtn").disabled = false;
}

function advanceKnowledge(key, nextScreen){
  const list = window.__currentKnowledgeList;
  answers[key].push(selected);
  answered = false; selected = null;
  idx++;
  if(idx >= list.length){
    idx = 0; screen = nextScreen;
  }
  render();
}

function renderBehaviour(list, key, nextScreen, tagClass, title){
  const item = list[idx];
  app.innerHTML = `
    <div class="ledgerline"><span class="module-tag ${tagClass}">${title}</span><span class="dash"></span><span>Behaviour ${idx+1} / ${list.length}</span></div>
    ${progressBar(idx, list.length)}
    <div class="qcard">
      <div class="qframing">${item.framing}</div>
      <div class="qtext">${item.q}</div>
      <div class="yn">
        <button class="opt" onclick="selectBehaviour('${key}','${nextScreen}',0)">Yes</button>
        <button class="opt" onclick="selectBehaviour('${key}','${nextScreen}',1)">No</button>
      </div>
    </div>
  `;
  window.__currentBehaviourList = list;
}

function selectBehaviour(key, nextScreen, i){
  const list = window.__currentBehaviourList;
  answers[key].push(i);
  idx++;
  if(idx >= list.length){ idx=0; screen = nextScreen; }
  render();
}

function renderAttitude(list, key, nextScreen, tagClass, title){
  const item = list[idx];
  app.innerHTML = `
    <div class="ledgerline"><span class="module-tag ${tagClass}">${title}</span><span class="dash"></span><span>Attitude ${idx+1} / ${list.length}</span></div>
    ${progressBar(idx, list.length)}
    <div class="qcard">
      <div class="qframing">${item.framing}</div>
      <div class="qtext">"${item.statement}"</div>
      <div class="likert">
        <div class="likert-scale">
          ${[1,2,3,4,5].map(v=>`<button class="likert-btn" data-v="${v}" onclick="selectAttitude('${key}','${nextScreen}',${v})">${v}</button>`).join("")}
        </div>
        <div class="likert-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
      </div>
    </div>
  `;
}

function selectAttitude(key, nextScreen, v){
  answers[key].push(v);
  idx++;
  const list = key.endsWith("a") && key.startsWith("m1") ? MOD1_ATTITUDE : MOD2_ATTITUDE;
  if(idx >= list.length){ idx=0; screen = nextScreen; }
  render();
}

function renderInterstitial(){
  app.innerHTML = `
    <div class="interstitial">
      <div class="ledgerline" style="justify-content:center;"><span class="module-tag tag-1">MODULE 1 COMPLETE</span></div>
      <p class="muted">Your traditional financial literacy answers are recorded.<br>Now the second ledger.</p>
      <h2 style="margin-top:20px;">Module 2 — Monetary Sovereignty &amp; Structural Risk</h2>
      <p class="muted" style="max-width:440px;margin:0 auto 24px;">21 questions on currency debasement, counterparty risk, and alternatives — physical cash, gold, and Bitcoin — outside the traditional banking system.</p>
      <button class="primary" onclick="startModule2()">Begin Module 2</button>
    </div>
  `;
}

function startQuiz(){ screen="m1k"; idx=0; render(); }
function startModule2(){ screen="m2k"; idx=0; render(); }

function renderResults(){
  const t = computeTotals();
  app.innerHTML = `
    <div class="ledgerline"><span>RESULTS</span><span class="dash"></span><span>Two Ledgers</span></div>
    <h1 style="font-size:1.6rem;">Your two totals</h1>
    <p class="muted">Both scored 0–21, same method, no pass/fail line. Here's how each was reached.</p>

    <div class="resultsgrid">
      <div class="resultcard card-1">
        <h3>MODULE 1 · TRADITIONAL</h3>
        <div class="resulttotal">${t.m1.total.toFixed(1)} <span style="font-size:1.1rem;color:var(--muted);">/ 21</span></div>
        <div class="breakrow"><span>Knowledge</span><span class="val">${t.m1.k} / 7</span></div>
        <div class="breakrow"><span>Behaviour</span><span class="val">${t.m1.b} / 9</span></div>
        <div class="breakrow"><span>Attitude</span><span class="val">${t.m1.a.toFixed(1)} / 5</span></div>
      </div>
      <div class="resultcard card-2">
        <h3>MODULE 2 · SOVEREIGNTY</h3>
        <div class="resulttotal">${t.m2.total.toFixed(1)} <span style="font-size:1.1rem;color:var(--muted);">/ 21</span></div>
        <div class="breakrow"><span>Knowledge</span><span class="val">${t.m2.k} / 7</span></div>
        <div class="breakrow"><span>Behaviour</span><span class="val">${t.m2.b} / 9</span></div>
        <div class="breakrow"><span>Attitude</span><span class="val">${t.m2.a.toFixed(1)} / 5</span></div>
      </div>
    </div>

    <div class="gridviz">
      <h3 style="font-family:var(--mono);font-size:.78rem;color:var(--muted);margin:0 0 12px;">POSITION ON BOTH SCALES</h3>
      ${renderGrid(t.m1.total, t.m2.total)}
    </div>

    <p class="muted" style="font-size:.85rem;">These numbers describe where you land on two different frameworks — they aren't a ranking of one against the other, and there's no combined "final score."</p>
    <button class="restart" onclick="restart()">Start over</button>
  `;
}

function renderGrid(x, y){
  const W=280,H=280,pad=30;
  const px = pad + (x/21)*(W-2*pad);
  const py = H-pad - (y/21)*(H-2*pad);
  return `
  <svg viewBox="0 0 ${W} ${H}">
    <rect x="0" y="0" width="${W}" height="${H}" fill="none"/>
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#c9cfc4" stroke-width="1"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#c9cfc4" stroke-width="1"/>
    <text x="${W/2}" y="${H-6}" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#5c6b64">TRADITIONAL →</text>
    <text x="10" y="${H/2}" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#5c6b64" transform="rotate(-90 10 ${H/2})">SOVEREIGNTY →</text>
    <circle cx="${px}" cy="${py}" r="6" fill="#1c2b2e"/>
  </svg>`;
}

function restart(){
  screen="intro"; idx=0; answered=false; selected=null;
  Object.keys(answers).forEach(k=>answers[k]=[]);
  render();
}

render();
</script>
